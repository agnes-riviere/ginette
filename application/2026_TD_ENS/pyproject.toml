[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ginette-2026-td-ens"
version = "0.1.0"
description = "TD Ginette : modele direct sur un cas synthetique d'echange nappe-riviere"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "seaborn",
    "fortranformat",
    "ipython",
    "jupyter",
    "ipykernel",
]

[tool.setuptools]
py-modules = []
